<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Phone Bridge</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#d9580f">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Barlow:wght@400;500;600;700&display=swap">
<style>
:root{color-scheme:light dark;
--bg:light-dark(#ffffff,#121417);--card:light-dark(#f4f5f7,#1b1e23);--ink:light-dark(#15191f,#e9ecf1);--mute:light-dark(#5b6573,#9aa4b2);--line:light-dark(#dde1e7,#2d333c);
--acc:light-dark(#d9580f,#ff8f4d);--accInk:light-dark(#ffffff,#1a0d05);--a:light-dark(#1f5fbf,#6fa4ff);--aS:light-dark(#e6efff,#18263d);--b:light-dark(#8a2f8f,#dd8ae2);--bS:light-dark(#f7e8f8,#301c33);--bad:light-dark(#b3261e,#ff8a80);
--disp:"Barlow Condensed","Arial Narrow",sans-serif;--body:"Barlow",system-ui,sans-serif}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);overflow-x:clip}
.wrap{max-width:720px;margin:0 auto;padding:clamp(18px,4vw,40px) max(4vw,14px) 56px;display:grid;gap:16px}
h1{font:800 clamp(32px,7vw,46px)/1.05 var(--disp);margin:0}
.sub{color:var(--mute);margin:4px 0 0}
.seg{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg span{font-weight:600;color:var(--mute);font-size:14px;margin-right:4px}
.seg button{font:700 17px var(--body);min-height:44px;padding:8px 18px;border-radius:999px;border:2px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.seg button[aria-pressed=true][data-p="Galaxy 26"]{background:var(--a);border-color:var(--a);color:#fff}
.seg button[aria-pressed=true][data-p="24"]{background:var(--b);border-color:var(--b);color:#fff}
.box{border:2.5px solid var(--ink);border-radius:22px;padding:14px;display:grid;gap:10px;background:var(--bg)}
.box.drag{border-color:var(--acc);background:var(--card)}
input[type=text],textarea{font:16px/1.45 var(--body);color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;width:100%}
textarea{min-height:150px;resize:vertical;font-family:ui-monospace,monospace;font-size:15px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button{font:700 16px var(--body);min-height:44px;padding:8px 16px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
button.go{background:var(--acc);border-color:var(--acc);color:var(--accInk);flex:1 1 160px}
button:disabled{opacity:.5;cursor:default}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,label.file:focus-within{outline:3px solid var(--acc);outline-offset:2px}
label.file{display:inline-flex;align-items:center;min-height:44px;padding:8px 16px;border-radius:12px;border:1.5px dashed var(--mute);font-weight:700;cursor:pointer}
label.file input{position:absolute;opacity:0;width:1px;height:1px}
.note{font-size:14px;color:var(--mute);min-height:1.4em}
.note.err{color:var(--bad)}
.count{font-size:13px;color:var(--mute);margin-left:auto}
.shelfh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;margin-top:8px}
h2{font:800 28px/1 var(--disp);margin:0}
.filt{display:flex;gap:6px;flex-wrap:wrap}
.filt button{min-height:36px;padding:4px 12px;font-size:14px;border-radius:999px}
.filt button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.list{display:grid;gap:10px}
.it{border-radius:16px;padding:12px 14px;background:var(--card);border-left:6px solid var(--line);display:grid;gap:8px}
.it.pa{border-left-color:var(--a)}.it.pb{border-left-color:var(--b)}
.meta{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;font-size:13px;color:var(--mute)}
.badge{font-weight:700;font-size:12.5px;padding:2px 9px;border-radius:999px;white-space:nowrap}
.pa .badge{background:var(--aS);color:var(--a)}.pb .badge{background:var(--bS);color:var(--b)}
.ttl{font-weight:700;font-size:17px;overflow-wrap:anywhere}
.txt{font:14px/1.45 ui-monospace,monospace;white-space:pre-wrap;overflow-wrap:anywhere;max-height:7.5em;overflow:hidden;margin:0}
.txt.open{max-height:none}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.acts button,.acts a{min-height:40px;padding:6px 14px;font-size:15px}
.acts a{display:inline-flex;align-items:center;border-radius:12px;border:1.5px solid var(--line);color:var(--ink);text-decoration:none;font-weight:700;background:var(--bg)}
.acts .copy{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.acts .del{margin-left:auto;color:var(--bad)}
.thumb{max-width:100%;max-height:220px;border-radius:10px;display:block}
.empty{color:var(--mute);text-align:center;padding:28px 10px;border:1.5px dashed var(--line);border-radius:16px}
.off{border-radius:16px;padding:14px;background:var(--card)}
summary{cursor:pointer;min-height:32px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:700;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
.toast.show{opacity:1}
</style>
</head>
<body>
<div class="wrap">
<header><h1>Phone Bridge</h1><p class="sub">Drop text or a file on one phone, then pick it up on the other. Everything stays exactly as you sent it.</p></header>
<div class="seg" role="group" aria-label="This phone"><span>This phone:</span><button data-p="Galaxy 26" aria-pressed="false">Galaxy 26</button><button data-p="24" aria-pressed="false">24</button></div>
<section class="box" id="box" aria-label="Drop box">
<input type="text" id="title" placeholder="Label (optional), e.g. List A, Master code" maxlength="120">
<textarea id="text" placeholder="Paste a prompt, batch list or code here"></textarea>
<div class="row">
<button class="go" id="send" disabled>Send text</button>
<label class="file">Add files<input type="file" id="file" multiple></label>
<span class="count" id="cnt"></span>
</div>
<p class="note" id="st">Connecting…</p>
</section>
<details class="off" id="setup"><summary><b>Shelf setup</b> (once per phone)</summary>
<p class="note">Paste your GitHub token and the private shelf repo. Saved only on this phone.</p>
<input type="text" id="tok" placeholder="GitHub token (github_pat_…)" autocomplete="off">
<input type="text" id="repo" placeholder="owner/repo" style="margin-top:8px">
<div class="row" style="margin-top:8px"><button class="go" id="save">Save & connect</button></div></details>
<div class="shelfh"><h2>Waiting on the shelf</h2>
<div class="filt" role="group" aria-label="Show"><button data-f="all" aria-pressed="true">All</button><button data-f="Galaxy 26" aria-pressed="false">From Galaxy 26</button><button data-f="24" aria-pressed="false">From 24</button></div></div>
<div class="list" id="list"><div class="empty">Loading…</div></div>
</div>
<div class="toast" id="toast" role="status"></div>
<script>
{
const $=id=>document.getElementById(id);
const API='https://api.github.com';
let phone=null,tok='',repo='mwillard0927-ctrl/bridge-shelf',items=[],filt='all',open=new Set(),ready=false,cache={},urls={};
try{phone=localStorage.getItem('bridge-phone');tok=localStorage.getItem('bridge-tok')||'';repo=localStorage.getItem('bridge-repo')||repo}catch(e){}
$('tok').value=tok;$('repo').value=repo;if(!tok)$('setup').open=true;
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('show'),1800)}
function note(m,err){const s=$('st');s.textContent=m;s.classList.toggle('err',!!err)}
function ago(t){const s=(Date.now()-t)/1000;if(s<60)return'just now';if(s<3600)return Math.floor(s/60)+' min ago';if(s<86400)return Math.floor(s/3600)+' h ago';return new Date(t).toLocaleDateString('en-US',{month:'short',day:'numeric'})}
function kb(n){return n>1048576?(n/1048576).toFixed(1)+' MB':Math.max(1,Math.round(n/1024))+' KB'}
function setPhone(p){phone=p;try{localStorage.setItem('bridge-phone',p)}catch(e){}document.querySelectorAll('.seg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.p===p));upd()}
function upd(){const n=$('text').value.length;$('cnt').textContent=n?n.toLocaleString()+' chars':'';$('send').disabled=!ready||!n||!phone;if(ready&&!phone)note('Pick which phone this is first.')}
document.querySelector('.seg').onclick=e=>{const b=e.target.closest('button');if(b){setPhone(b.dataset.p);if(ready)note('Ready.')}};
if(phone)setPhone(phone);
$('text').oninput=upd;
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
async function gh(path,opt={}){const r=await fetch(API+'/repos/'+repo+path,{...opt,headers:{Authorization:'Bearer '+tok,Accept:opt.accept||'application/vnd.github+json',...(opt.body?{'Content-Type':'application/json'}:{})},cache:'no-store'});
  if(r.status===404&&opt.ok404)return null;if(!r.ok)throw new Error(r.status===401?'Token rejected':r.status===404?'Shelf repo not found':'GitHub error '+r.status);return opt.raw?r:r.status===204?null:r.json()}
const b64txt=s=>{const u=new TextEncoder().encode(s);let b='';for(let i=0;i<u.length;i+=8192)b+=String.fromCharCode(...u.subarray(i,i+8192));return btoa(b)};
const b64file=f=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result.split(',')[1]);r.onerror=no;r.readAsDataURL(f)});
const put=(p,content,msg)=>gh('/contents/'+p,{method:'PUT',body:JSON.stringify({message:msg,content})});
async function fileUrl(x){if(urls[x.id])return urls[x.id];const r=await gh('/contents/'+encodePath(x.path),{raw:1,accept:'application/vnd.github.raw'});const b=await r.blob();return urls[x.id]=URL.createObjectURL(new Blob([b],{type:x.type||b.type}))}
const encodePath=p=>p.split('/').map(encodeURIComponent).join('/');
async function load(){
  const list=await gh('/contents/drops',{ok404:1})||[];
  const next=[];
  for(const f of list){if(!f.name.endsWith('.json'))continue;
    if(!cache[f.sha]){const r=await gh('/contents/'+encodePath(f.path),{raw:1,accept:'application/vnd.github.raw'});cache[f.sha]=await r.json()}
    next.push({...cache[f.sha],id:f.name.slice(0,-5),sha:f.sha,text:cache[f.sha].text||''})}
  items=next;
  if(!ready){ready=true;note(phone?'Ready.':'Pick which phone this is first.')}
  upd();render();
}
function render(){
  const L=items.filter(x=>filt==='all'||x.from===filt).sort((a,b)=>b.at-a.at);
  if(!L.length){$('list').innerHTML=`<div class="empty">${items.length?'Nothing from that phone yet.':'Nothing waiting. Send something from either phone and it shows up here on both.'}</div>`;return}
  $('list').innerHTML=L.map(x=>{
    const pc=x.from==='Galaxy 26'?'pa':'pb',isOpen=open.has(x.id);
    let body='',acts='';
    if(x.kind==='text'){
      body=`<pre class="txt${isOpen?' open':''}">${esc(x.text.length>4000&&!isOpen?x.text.slice(0,4000)+'…':x.text)}</pre>`;
      acts=`<button class="copy" data-a="copy" data-id="${x.id}">Copy</button>`+(x.text.split('\n').length>5||x.text.length>400?`<button data-a="more" data-id="${x.id}">${isOpen?'Show less':'Show all'}</button>`:'');
    }else{
      const img=/^image\//.test(x.type||'');
      body=img?`<img class="thumb" data-img="${x.id}" alt="${esc(x.name)}">`:'';
      acts=`<button data-a="openf" data-id="${x.id}">Open file</button>`+(x.isText?`<button class="copy" data-a="copyfile" data-id="${x.id}">Copy text</button>`:'');
    }
    const ttl=x.title||(x.kind==='file'?x.name:'');
    const size=x.kind==='file'?' · '+kb(x.size||0):' · '+x.text.length.toLocaleString()+' chars';
    return `<article class="it ${pc}"><div class="meta"><span class="badge">From ${esc(x.from)}</span><span>${ago(x.at)}${size}</span></div>${ttl?`<div class="ttl">${esc(ttl)}</div>`:''}${body}<div class="acts">${acts}<button class="del" data-a="del" data-id="${x.id}">Delete</button></div></article>`;
  }).join('');
  document.querySelectorAll('img[data-img]').forEach(async im=>{const x=items.find(i=>i.id===im.dataset.img);if(x&&x.size<5*1048576){try{im.src=await fileUrl(x)}catch(_){}}});
}
document.querySelector('.filt').onclick=e=>{const b=e.target.closest('button');if(!b)return;filt=b.dataset.f;document.querySelectorAll('.filt button').forEach(x=>x.setAttribute('aria-pressed',x===b));render()};
async function copyText(t){try{await navigator.clipboard.writeText(t);toast('Copied')}catch(e){const ta=document.createElement('textarea');ta.value=t;document.body.append(ta);ta.select();let ok=false;try{ok=document.execCommand('copy')}catch(_){}ta.remove();toast(ok?'Copied':'Copy blocked here. Tap "Show all" and select it.')}}
$('list').onclick=async e=>{
  const b=e.target.closest('[data-a]');if(!b)return;const x=items.find(i=>i.id===b.dataset.id);if(!x)return;
  if(b.dataset.a==='copy')copyText(x.text);
  else if(b.dataset.a==='more'){open.has(x.id)?open.delete(x.id):open.add(x.id);render()}
  else if(b.dataset.a==='openf'){toast('Loading…');try{const u=await fileUrl(x);const a=document.createElement('a');a.href=u;a.download=x.name;a.target='_blank';document.body.append(a);a.click();a.remove()}catch(_){toast('Could not load the file.')}}
  else if(b.dataset.a==='copyfile'){try{const u=await fileUrl(x);copyText(await (await fetch(u)).text())}catch(_){toast('Could not load the text.')}}
  else if(b.dataset.a==='del'){
    if(b.dataset.sure!=='1'){b.dataset.sure='1';b.textContent='Tap again to delete';setTimeout(()=>{if(b.isConnected){b.dataset.sure='';b.textContent='Delete'}},3000);return}
    b.disabled=true;try{
      if(x.path){const m=await gh('/contents/'+encodePath(x.path),{ok404:1});if(m)await gh('/contents/'+encodePath(x.path),{method:'DELETE',body:JSON.stringify({message:'delete file',sha:m.sha})})}
      await gh('/contents/drops/'+x.id+'.json',{method:'DELETE',body:JSON.stringify({message:'delete drop',sha:x.sha})});
      toast('Deleted');await load()}catch(_){b.disabled=false;toast('Could not delete. Try again.')}
  }
};
async function sendDrop(o){const id=uid();await put('drops/'+id+'.json',b64txt(JSON.stringify(o)),'drop from '+phone)}
$('send').onclick=async()=>{
  const text=$('text').value,title=$('title').value.trim();if(!text||!phone)return;
  $('send').disabled=true;note('Sending…');
  try{await sendDrop({kind:'text',from:phone,at:Date.now(),title,text});
    $('text').value='';$('title').value='';note('Sent. It\'s on the shelf on both phones.');toast('Sent');await load()
  }catch(e){note('Not sent: '+((e&&e.message)||'check your connection and try again.'),true)}
  upd();
};
async function sendFiles(fs){
  if(!phone){note('Pick which phone this is first.',true);return}
  if(!ready){note('Set up the shelf first.',true);return}
  const title=$('title').value.trim();let n=0;
  for(const f of fs){if(f.size>40*1048576){note(f.name+' is over 40 MB, too big to send.',true);continue}
    note('Uploading '+f.name+'…');
    try{const id=uid(),path='files/'+id+'-'+(f.name||'file').replace(/[^\w.-]+/g,'-');
      await put(encodePath(path),await b64file(f),'file from '+phone);
      await sendDrop({kind:'file',from:phone,at:Date.now(),title,name:f.name||'file',size:f.size,type:f.type||'',path,isText:/^text\/|json|markdown|csv/.test(f.type||'')});n++
    }catch(e){note('Could not upload '+f.name+': '+e.message,true)}}
  if(n){$('title').value='';note(n+' file'+(n>1?'s':'')+' sent.');toast('Sent');await load()}
}
$('file').onchange=()=>{sendFiles([...$('file').files]);$('file').value=''};
const box=$('box');
box.addEventListener('dragover',e=>{e.preventDefault();box.classList.add('drag')});
box.addEventListener('dragleave',()=>box.classList.remove('drag'));
box.addEventListener('drop',e=>{e.preventDefault();box.classList.remove('drag');if(e.dataTransfer.files.length)sendFiles([...e.dataTransfer.files])});
async function connect(){if(!tok){note('Open Shelf setup and paste your token.',true);$('list').innerHTML='<div class="off">The shelf needs a GitHub token. See Shelf setup above.</div>';return}
  try{await load();$('setup').open=false}catch(e){ready=false;note('Can\'t reach the shelf: '+e.message,true);$('setup').open=true}}
$('save').onclick=()=>{tok=$('tok').value.trim();repo=$('repo').value.trim()||repo;try{localStorage.setItem('bridge-tok',tok);localStorage.setItem('bridge-repo',repo)}catch(e){}note('Connecting…');connect()};
connect();
setInterval(()=>{if(ready&&!document.hidden)load().catch(()=>{})},8000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&ready)load().catch(()=>{})});
}
</script>
</body>
</html>
